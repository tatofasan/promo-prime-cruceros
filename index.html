<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prime Cruceros · promo 30 s</title>
  <link rel="stylesheet" href="/src/preview.css" />
</head>
<body>
  <main id="wrap">
    <div id="frame"><canvas id="view" width="1920" height="1080"></canvas><div id="safe"></div></div>
  </main>
  <footer id="transport">
    <button id="play" title="Reproducir / pausar (espacio)">▶</button>
    <div id="bar">
      <div id="sections"></div>
      <div id="cuemarks"></div>
      <input id="scrub" type="range" min="0" max="30" step="0.0166667" value="0" />
    </div>
    <span id="clock">00.000 · c0 b1</span>
    <label><input id="safeToggle" type="checkbox" /> márgenes</label>
    <span id="status"></span>
  </footer>
  <script>
    // formato antes de cargar el motor: ?format=9x16 → versión vertical
    window.__FORMAT__ = new URLSearchParams(location.search).get('format') === '9x16' ? '9x16' : '16x9';
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
